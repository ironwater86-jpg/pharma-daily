var D=[{"title": "미국 제친 중국 성장세 매섭다…\"한국 암 연구 시스템 완전히 바꿔야\"", "summary": "암 연구도 인공지능(AI)과 빅데이터를 중심으로 트렌드가 빠르게 변화하고 있다. 특히 국가 차원에서 집중적으로 투자하고 있는 중국의 성장세가 매섭다. 연구자 개개인의 노력에 기대던 한국 연구 환경에도 변화가 필요하다는 지적이 나온다.지난 10일 대한민국의학한림원과 대한암학회는 서울 중구 프레스센터에서 '한국 암 연구 성과 분석 보고회'를 열고 그간 성과를 돌아보고 향후 발전 방향을 논의했다.이번 연구는 지난 2005년부터 2024년까지 Scop...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042686", "source": "청년의사", "date": "2026-09-11", "time": "16:02", "cat": "general", "imp": "medium", "lang": "ko"}, {"title": "[기자수첩] 만성콩팥병 환자는 '생존 투쟁' 중인데…복지부는 직무유기", "summary": "비만이나 만성콩팥병처럼 최근 국회에서 입법이 추진되는 질환 분야에는 한 가지 공통점이 있다. '더 이상 개인이 감당하고 해결할 수 있는 영역이 아니니, 국가가 전면에 나서 체계적으로 관리하라'는 요구다. 비만을 개인의 의지나 식습관 문제로 폄하하지 않고 국가 기본법을 만들어 관리하려는 움직임 역시 같은 맥락이다. 질병의 패러다임이 바뀐 만큼, 보건의료 체계 역시 국가적 책임 중심으로 재편돼야 한다는 시대적 합의다.11일 보건복지위원회 전체회의에...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042684", "source": "청년의사", "date": "2026-09-11", "time": "15:41", "cat": "chronic", "imp": "medium", "lang": "ko"}, {"title": "수술 없이 안구돌출 개선…표적치료가 연 갑상선안병증 새 시대", "summary": "수술에 의존하지 않고 약물로 안구돌출과 복시 등 갑상선안병증의 구조적·기능적 증상을 개선할 수 있는 표적치료 시대가 열리고 있다.기존 면역억제 치료의 한계를 보완하는 새로운 치료 옵션과 한국형 진료 프레임워크가 제시되면서 치료 패러다임의 변화가 본격화한 가운데, 임상적 혜택을 환자에게 넓히기 위한 급여 접근성 확보가 향후 과제로 떠올랐다.대한갑상선학회는 지난달 28~29일 열린 '2026 대한갑상선학회 추계학술대회'에서 갑상선안병증을 집중 조명...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042687", "source": "청년의사", "date": "2026-09-11", "time": "15:28", "cat": "general", "imp": "medium", "lang": "ko"}, {"title": "의사 면허관리 새판 짜나…복지부-의협 실무 논의 착수", "summary": "정부와 대한의사협회가 의사 면허관리체계 개편을 위한 구체적인 논의에 들어간다. 의협이 주장해 온 ‘의협 산하 면허관리원’과는 다른 개념으로, 의정협의체 내 별도 실무협의체를 구성해 새로운 면허관리 방안을 논의하기로 했다.다만 의협이 대한변호사협회처럼 자체 징계 권한까지 갖는 방안은 국민 신뢰와 사회적 공감대가 필요한 장기 과제로 보고 있다.보건복지부 곽순헌 보건의료정책관은 최근 전문기자협의회와 만나 의사 면허관리체계 개편 논의 상황에 대해 설명...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042678", "source": "청년의사", "date": "2026-09-11", "time": "15:27", "cat": "policy", "imp": "medium", "lang": "ko"}, {"titl     var df=Math.round((t-dd)/86400000);
    var lb=df===0?"오늘":df===1?"어제":df+"일 전";
    h+="<button class='tb' onclick='sD(""+d+"",this)'>"+lb+" <span style='font-size:10px;opacity:.6'>"+n+"</span></button>";
  });
  document.getElementById("tabs").innerHTML=h;
}

function sD(d,b){curD=d;document.querySelectorAll(".tb").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();}
function fC(c,b){curC=c;document.querySelectorAll(".ct").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();}

function render(){
  var list=D.filter(function(a){return(curD==="all"||a.date===curD)&&(curC==="all"||a.cat===curC);});
  document.getElementById("s1").textContent=D.length;
  document.getElementById("s2").textContent=D.filter(function(a){return a.imp==="high";}).length;
  document.getElementById("s3").textContent=[...new Set(D.map(function(a){return a.cat;}))].length;
  document.getElementById("stx").textContent=D.length+"건 · 매일 오전 6시 자동 업데이트";
  var el=document.getElementById("al");
  if(!list.length){
    el.innerHTML="<div class='emp'><div class='eti'>해당 기사 없음</div><div class='ede'>날짜나 카테고리를 바꿔보세요.</div></div>";
    return;
  }
  var g={};
  list.forEach(function(a){if(!g[a.date])g[a.date]=[];g[a.date].push(a);});
  var h="";
  Object.keys(g).sort().reverse().forEach(function(d){
    var dd=new Date(d+"T00:00:00+09:00"),t=new Date();t.setHours(0,0,0,0);
    var df=Math.round((t-dd)/86400000);
    var lb=df===0?"오늘":df===1?"어제":df+"일 전";
    h+="<div class='sh'>"+lb+" · "+g[d].length+"건</div>";
    h+=g[d].map(mkCard).join("");
  });
  el.innerHTML=h;
}

bldTabs();render();
</script>
</body>
</html>
