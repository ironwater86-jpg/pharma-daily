var D=[{"title": "위암학회, 위암 수술 수가 현실화 촉구...“현대 술기·업무량 반영해야”", "summary": "[의학신문·일간보사=이재원 기자] 위암 수술에 적용되는 건강보험 수가가 현재의 수술 난이도와 의료진 업무량을 충분히 반영하지 못하고 있다는 지적이 제기됐다. 대한위암학회는 위장관외과 수술에 대한 저평가된 보상체계가 전문의 감소와 필수의료 기반 약화로 이어질 수 있다며 수가 현실화를 촉구했다.대한위암학회(이사장 이혁준 서울의대 위장관외과 교수)는 최근 JW 메리어트 동대문 스퀘어 서울에서 ‘대한위암학회 보험정책 세미나’를 개최하고 위암 수술의 건...", "url": "https://www.bosa.co.kr/news/articleView.html?idxno=3011555", "source": "보건신문", "date": "2026-09-07", "time": "15:15", "cat": "policy", "imp": "medium", "lang": "ko"}, {"title": "'코리아 패싱'은 기우인가 현실인가…정부·현장 엇갈린 진단", "summary": "\"객관적인 근거가 없다\"는 정부와 \"출시 순서 조정이 이미 시작됐다\"는 글로벌 제약업계가 혁신 신약의 '코리아 패싱'을 두고 정면으로 맞섰다.보건복지부는 국내 항암제·희귀질환 치료제의 신규 등재와 적응증 확대가 꾸준히 늘고 있어 한국이 신약 도입에서 배제되고 있다는 주장은 사실과 다르다는 입장이다. 그러나 의료계와 산업계는 공식적인 미출시 통계가 형성되기 전부터 고가 신약의 국내 마케팅 포기와 정보 전달 지연, 글로벌 본사의 출시 순위 조정 등...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042508", "source": "청년의사", "date": "2026-09-07", "time": "15:14", "cat": "policy", "imp": "medium", "lang": "ko"}, {"title": "넥스트 '림카토' 그리는 큐로셀…루푸스부터 고형암까지 '완치' 도전", "summary": "큐로셀이 국내 개발 최초 키메릭항원수용체 T세포(CAR-T) 치료제 '림카토주'(성분명 안발캅타젠오토류셀) 품목 허가 이후 후속 파이프라인 개발에 박차를 가하고 있다. '하이퍼카인(Hyperkine)' 기술이 적용된 고형암 CAR-T와 CD5·CD7을 표적으로 한 동종(allogeneic) CAR-T를 개발하고, 림카토의 전신홍반루푸스(Systemic Lupus Erythematosus, SLE) 적응증 확대도 진행 중이다.림카토의 국내 상용화...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042505", "source": "청년의사", "date": "2026-09-07", "time": "15:13", "cat": "pharma", "imp": "medium", "lang": "ko"}, {"title": "'보이지 않는 기반' 탄탄하게…세브란스 미래 준비한 2년", "summary": "2024년 의료현장은 의정갈등으로 크게 흔들렸다. 의대 정원 확대에 반발한 전공의들이 병원을 떠나면서 병원들은 하루아침에 비상진료체계에 돌입했다. 세브란스병원 이강영 원장이 취임한 것은 의정갈등이 한창이던 그해 4월이었다. 진료지원(PA) 간호사 제도화와 상급종합병원 구조전환까지 굵직한 변화가 잇따르면서 진료와 인력을 비롯한 병원 운영체계 전반을 다시 설계해야 했다.이 원장은 개별 현안을 각각 해결하는 방식 대신 병원 전체의 운영체계를 재정비하...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042497", "source": "청년의사", "date": "2026-09-07", "time": "15:12", "cat": "general", "imp": "medium", "lang": "ko"}, {"title" function bldTabs(){
  var dates=[...new Set(D.map(function(a){return a.date;}))] .sort().reverse();
  var h="<button class='tb on' onclick='sD("all",this)'>전체 <span style='font-size:10px;opacity:.6'>"+D.length+"</span></button>";
  dates.forEach(function(d){
    var n=D.filter(function(a){return a.date===d;}).length;
    var dd=new Date(d+"T00:00:00+09:00"),t=new Date();t.setHours(0,0,0,0);
    var df=Math.round((t-dd)/86400000);
    var lb=df===0?"오늘":df===1?"어제":df+"일 전";
    h+="<button class='tb' onclick='sD(""+d+"",this)'>"+lb+" <span style='font-size:10px;opacity:.6'>"+n+"</span></button>";
  });
  document.getElementById("tabs").innerHTML=h;
}

function sD(d,b){curD=d;document.querySelectorAll(".tb").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();}
function fC(c,b){curC=c;document.querySelectorAll(".ct").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();}

function render(){
  var list=D.filter(function(a){return(curD==="all"||a.date===curD)&&(curC==="all"||a.cat===curC);});
  document.getElementById("s1").textContent=D.length;
  document.getElementById("s2").textContent=D.filter(function(a){return a.imp==="high";}).length;
  document.getElementById("s3").textContent=[...new Set(D.map(function(a){return a.cat;}))].length;
  document.getElementById("stx").textContent=D.length+"건 · 매일 오전 6시 자동 업데이트";
  var el=document.getElementById("al");
  if(!list.length){
    el.innerHTML="<div class='emp'><div class='eti'>해당 기사 없음</div><div class='ede'>날짜나 카테고리를 바꿔보세요.</div></div>";
    return;
  }
  var g={};
  list.forEach(function(a){if(!g[a.date])g[a.date]=[];g[a.date].push(a);});
  var h="";
  Object.keys(g).sort().reverse().forEach(function(d){
    var dd=new Date(d+"T00:00:00+09:00"),t=new Date();t.setHours(0,0,0,0);
    var df=Math.round((t-dd)/86400000);
    var lb=df===0?"오늘":df===1?"어제":df+"일 전";
    h+="<div class='sh'>"+lb+" · "+g[d].length+"건</div>";
    h+=g[d].map(mkCard).join("");
  });
  el.innerHTML=h;
}

bldTabs();render();
</script>
</body>
</html>
