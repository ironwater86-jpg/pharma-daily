.emp{text-align:center;padding:50px 20px}
.eti{font-family:var(--fs);font-size:20px;margin-bottom:7px;color:var(--text)}
.ede{font-size:13px;color:var(--text3);line-height:1.8}

var D=[{"title": "천안·서울 전원 끝 끝내 숨진 아이…엄마의 호소 \"소아응급실 있었다면\"", "summary": "“아이에게 조금이라도 이상 징후가 있다면 병원으로 빨리 가는 것은 정말 중요합니다”평택에서 32개월 어린이가 패혈증 쇼크로 숨지는 일이 발생했다. 아이는 평택에서 천안, 서울로 전원됐지만 끝내 숨졌다. 이에 평택시는 재발 방지를 위해 야간·휴일 진료를 담당하는 달빛어린이병원을 추가 지정하고 소아 전문응급의료센터 구축을 추진할 예정이다.지난달 31일 국회 국민동의청원 게시판에는 영·유아와 소아들을 위한 의료 인프라 구축과 의료 환경 개선을 촉구하...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042064", "source": "청년의사", "date": "2026-08-25", "time": "15:23", "cat": "pediatrics", "imp": "medium", "lang": "ko"}, {"title": "국내 기술 수출 선급액 '싹쓸이'… K-바이오 체급 높인 한미약품", "summary": "한미약품의 대사질환 치료제 신약 후보물질 'HM17321(UCN2 유사체)'이 로슈(Roche) 그룹 자회사 제넨텍(Genentech)으로 기술 수출된 가운데, 이번 계약이 단일 후보물질 기준으로는 제약업계 사상 최대 규모인 것으로 알려지며 업계 이목이 쏠리고 있다.한미약품은 올해 국내 제약·바이오 기업의 전체 기술이전 계약 선급금(5,911억8,000만원) 중 63.6%(3,758억원)를 차지하는 기염을 토했다.한미약품은 지난 23일 제넨텍과...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042065", "source": "청년의사", "date": "2026-08-25", "time": "15:19", "cat": "pharma", "imp": "medium", "lang": "ko"}, {"title": "옵디보는 되고 키트루다는 안 되고…MSI-H 위암 급여 엇갈린 이유는", "summary": "고빈도 현미부수체 불안정성(MSI-H) 또는 불일치 복구 결함(dMMR)을 보이는 진행성 위암 환자의 면역항암제 급여 사각지대가 일부 해소될 전망이다. 하지만 급여 확대 대상에는 옵디보(성분명 니볼루맙)만 포함되고 키트루다(성분명 펨브롤리주맙)는 빠지면서 그 배경에 관심이 쏠린다.관련 학회가 당초 옵디보만 급여 확대 대상으로 요청한 것도 아닌 것으로 확인됐다. 키트루다 개발사인 한국MSD 역시 해당 적응증의 급여 확대가 무산된 것은 아니며 현재...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042063", "source": "청년의사", "date": "2026-08-25", "time": "15:12", "cat": "policy", "imp": "high", "lang": "ko"}, {"title": "전공의 '사직서 수리 금지' 소송 또 패소…법원 \"정부 명령 위법 아냐\"", "summary": "정부의 '전공의 집단사직서 수리 금지 명령'을 따랐던 수련병원에 손해배상 책임을 물을 수 없다는 법원 판단이 또 나왔다. 의대 증원에 반발해 사직서를 제출했던 전공의들이 수련병원을 상대로 제기한 잇딴 소송에 법원은 이번에도 당시 정부 명령이 위법하다고 볼 수 없다며 병원 측 손을 들어줬다.서울중앙지방법원은 지난 7월 24일 전공의 A씨와 B씨가 수련병원을 운영하는 재단법인 C를 상대로 제기한 손해배상 청구 소송에서 원고들의 청구를 모두 기각했다...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042038", "source": "청년의사", "date": "2026-08-25", "time": "15:11", "cat": "general", "imp": "medium", "lan   document.getElementById("tabs").innerHTML=h;
}

function sD(d,b){curD=d;document.querySelectorAll(".tb").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();}
function fC(c,b){curC=c;document.querySelectorAll(".ct").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();}

function render(){
  var list=D.filter(function(a){return(curD==="all"||a.date===curD)&&(curC==="all"||a.cat===curC);});
  document.getElementById("s1").textContent=D.length;
  document.getElementById("s2").textContent=D.filter(function(a){return a.imp==="high";}).length;
  document.getElementById("s3").textContent=[...new Set(D.map(function(a){return a.cat;}))].length;
  document.getElementById("stx").textContent=D.length+"건 · 매일 오전 6시 자동 업데이트";
  var el=document.getElementById("al");
  if(!list.length){
    el.innerHTML="<div class='emp'><div class='eti'>해당 기사 없음</div><div class='ede'>날짜나 카테고리를 바꿔보세요.</div></div>";
    return;
  }
  var g={};
  list.forEach(function(a){if(!g[a.date])g[a.date]=[];g[a.date].push(a);});
  var h="";
  Object.keys(g).sort().reverse().forEach(function(d){
    var dd=new Date(d+"T00:00:00+09:00"),t=new Date();t.setHours(0,0,0,0);
    var df=Math.round((t-dd)/86400000);
    var lb=df===0?"오늘":df===1?"어제":df+"일 전";
    h+="<div class='sh'>"+lb+" · "+g[d].length+"건</div>";
    h+=g[d].map(mkCard).join("");
  });
  el.innerHTML=h;
}

bldTabs();render();
</script>
</body>
