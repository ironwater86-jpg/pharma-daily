var D=[{"title": "정신응급도 필수의료로…“병원이 중증·응급 정신질환자 받을 수 있어야”", "summary": "정신응급을 필수의료에 포함하기 위한 정부 논의가 본격화될 전망이다. 의료 현장에서는 필수의료에 이름을 올리는 것만으로는 부족하다며 실제 의료기관이 중증·응급 정신질환자를 받을 수 있도록 수가, 인력, 병상 등 후속 지원책을 함께 마련해야 한다는 입장이다.특히 급성기 정신질환자를 치료할수록 의료기관의 부담이 커지는 보상체계를 개선하는 것은 물론 환자 이송체계와 비자의입원에 따른 사법리스크까지 함께 손봐야 실제 의료 현장의 변화를 끌어낼 수 있다는...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042304", "source": "청년의사", "date": "2026-09-02", "time": "16:09", "cat": "policy", "imp": "medium", "lang": "ko"}, {"title": "의료계 반발 ‘관리급여’ 도입을 지난해 성과로 자평한 복지부", "summary": "보건복지부가 의료계의 거센 반발을 불렀던 비급여 관리 강화와 실손보험 개혁을 지난해 보건의료 분야 주요 성과로 평가했다. 특히 ‘관리급여’ 도입 방향을 의료체계의 구조적 문제를 해결하기 위한 의료개혁 한 축으로 강조했다.복지부는 이같은 내용을 담은 ‘2025 보건복지백서’를 최근 공개했다. 복지부는 백서를 통해 지난해 보건의료 분야에서 지역·필수·공공의료 강화, 의료전달체계 개편, 비급여·실손보험 개혁, 전공의 수련환경 개선 등을 주요 성과로 ...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042345", "source": "청년의사", "date": "2026-09-02", "time": "15:58", "cat": "policy", "imp": "high", "lang": "ko"}, {"title": "정신건강 현장에 존재하는 치료 연속성 '공백', 어떻게 채울까", "summary": "정신건강의학과가 환자 치료 연속성 확보를 고민하고 있다. 선택형 세로토닌 재흡수 억제제(SSRI) 처방 기준 완화 이후 진료과 간 환자 연계는 물론 정신건강의학과 내 중증 입원 전달 체계에도 해결하기 어려운 공백이 존재한다는 것이다.대한정신건강의학과의사회 조근호 회장은 최근 언론과 만난 자리에서 \"현시점에서 다른 과의 SSRI 처방을 무조건 막아야 한다고 생각하지는 않는다. 우울증 환자가 분명하다면, 정부 고시와 처방 가이드라인 준수하에 (정신...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042353", "source": "청년의사", "date": "2026-09-02", "time": "15:51", "cat": "general", "imp": "medium", "lang": "ko"}, {"title": "바이오 사업 일군 고한승, 20년 만에 삼성 '신약판' 다시 짠다", "summary": "삼성이 바이오시밀러와 위탁개발생산(CDMO)을 넘어 신약과 차세대 모달리티로 사업영역을 넓히고 있다. 이에 삼성 바이오 사업의 태동부터 성장까지 핵심 역할을 해온 고한승 미래사업기획단장을 중심으로, 삼성에피스홀딩스의 신약개발과 삼성바이오로직스의 신규 모달리티 확대, 라이프사이언스펀드를 통한 기술 투자와 국내외 바이오벤처 협업을 살펴봤다. 이를 통해 삼성의 바이오 사업이 기존 CDMO·바이오시밀러 중심에서 신약과 외부 혁신기술을 결합한 새로운 성...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3042336", "source": "청년의사", "date": "2026-09-02", "time": "15:47", "cat": "general", "imp": "high", "lang": "ko"}, {"title":   dates.forEach(function(d){
    var n=D.filter(function(a){return a.date===d;}).length;
    var dd=new Date(d+"T00:00:00+09:00"),t=new Date();t.setHours(0,0,0,0);
    var df=Math.round((t-dd)/86400000);
    var lb=df===0?"오늘":df===1?"어제":df+"일 전";
    h+="<button class='tb' onclick='sD(""+d+"",this)'>"+lb+" <span style='font-size:10px;opacity:.6'>"+n+"</span></button>";
  });
  document.getElementById("tabs").innerHTML=h;
}

function sD(d,b){curD=d;document.querySelectorAll(".tb").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();}
function fC(c,b){curC=c;document.querySelectorAll(".ct").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();}

function render(){
  var list=D.filter(function(a){return(curD==="all"||a.date===curD)&&(curC==="all"||a.cat===curC);});
  document.getElementById("s1").textContent=D.length;
  document.getElementById("s2").textContent=D.filter(function(a){return a.imp==="high";}).length;
  document.getElementById("s3").textContent=[...new Set(D.map(function(a){return a.cat;}))].length;
  document.getElementById("stx").textContent=D.length+"건 · 매일 오전 6시 자동 업데이트";
  var el=document.getElementById("al");
  if(!list.length){
    el.innerHTML="<div class='emp'><div class='eti'>해당 기사 없음</div><div class='ede'>날짜나 카테고리를 바꿔보세요.</div></div>";
    return;
  }
  var g={};
  list.forEach(function(a){if(!g[a.date])g[a.date]=[];g[a.date].push(a);});
  var h="";
  Object.keys(g).sort().reverse().forEach(function(d){
    var dd=new Date(d+"T00:00:00+09:00"),t=new Date();t.setHours(0,0,0,0);
    var df=Math.round((t-dd)/86400000);
    var lb=df===0?"오늘":df===1?"어제":df+"일 전";
    h+="<div class='sh'>"+lb+" · "+g[d].length+"건</div>";
    h+=g[d].map(mkCard).join("");
  });
  el.innerHTML=h;
}

bldTabs();render();
</script>
</body>
</html>
