*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.card.open .arr{transform:rotate(180deg)}
.emp{text-align:center;padding:50px 20px}
.eti{font-family:var(--fs);font-size:20px;margin-bottom:7px;color:var(--text)}
.ede{font-size:13px;color:var(--text3);line-height:1.8}
@media(min-width:480px){.hdr,.tbr{padding-left:24px;padding-right:24px}.tbs,.cts{padding-left:24px;padding-right:24px}.aw,.sts{padding-left:24px;padding-right:24px}}

var D=[{"title": "\"법 시행 전 약 배송 전면확대?\"…복지부 국감서 여야 질타", "summary": "오는 12월 취약계층 중심의 비대면진료 약 배송 제도 시행을 앞두고, 정부의 '약 배송 전면 확대' 방침과 '창고형 약국의 의약품 대량 판매' 문제가 국회 보건복지위원회 국정감사에서 도마 위에 올랐다. 여야 의원들과 대한약사회는 안전성 검증 부실과 사회적 합의 파기를 이유로 강하게 반발한 반면, 정부는 의견 수렴을 위한 논의 시작 단계라고 해명했다.국회 보건복지위원장인 국민의힘 이만희 의원은 지난 8일 보건복지위원회 국정감사에서 약사회 권영희 ...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3043478", "source": "청년의사", "date": "2026-10-09", "time": "16:32", "cat": "policy", "imp": "medium", "lang": "ko"}, {"title": "위고비 62%·마운자로 56% 의료기관 공급…대부분 의원급", "summary": "위고비와 마운자로 등 비만치료 주사제 공급량의 절반 이상이 약국이 아닌 의료기관으로 직접 유통된 것으로 나타났다. 특히 일부 의원에 공급량이 집중되면서 의약분업 원칙에 어긋나는 원내 판매가 이뤄지고 있는 것 아니냐는 의혹이 제기되고 있다.더불어민주당 남인순 의원은 건강보험심사평가원 관련 자료를 분석해 지난 8일 이같이 밝혔다. 남 의원에 따르면 위고비가 출시된 지난 2024년 10월부터 2026년 7월까지 의료기관 등에 공급된 물량은 192만3...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3043477", "source": "청년의사", "date": "2026-10-09", "time": "16:18", "cat": "policy", "imp": "medium", "lang": "ko"}, {"title": "치료비 부담에 치료 미루는 중증호산구성천식 환자들", "summary": "치료를 받기 위해 급성 악화를 기다려야 한다는 중증호산구성천식 환자들의 현실에 대한 개선 요구가 나왔다.한국중증호산구성천식환우회는 국회 앞에서 피켓 시위를 열고 국민건강보험공단의 중증호산구성천식에 대한 산정특례 적용 검토를 촉구했다고 지난 8일 밝혔다.중증호산구성천식은 고용량 흡입 스테로이드와 추가 조절제를 사용해도 증상이 조절되지 않거나 급성 악화가 반복되는 중증·난치성 천식이다.생물학적 제제는 중증 천식 환자의 증상과 급성 악화를 줄이는 데...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3043472", "source": "청년의사", "date": "2026-10-09", "time": "16:02", "cat": "policy", "imp": "medium", "lang": "ko"}, {"title": "[칼럼] 첫 악화를 막으려면 왜 약값만 지원해서는 안 되는가", "summary": "COPD(만성폐쇄성폐질환) 치료에서 최근 중요하게 강조되는 목표 가운데 하나는 ‘첫 악화’를 막는 것이다. 한 번 급성악화를 경험하면 다시 악화될 가능성이 높아지고 이후 심혈관 사건이나 사망 위험도 증가할 수 있기 때문이다. COPD 치료가 단순한 증상 완화를 넘어 급성악화를 예방하고 장기적인 위험을 낮추는 방향으로 이동하는 이유다.최근 국내에서도 단일 흡입기 삼중요법 치료제에 건강보험 급여가 적용되면서 치료 선택지가 넓어졌다. 기존 치료로 충...", "url": "http://www.docdocdoc.co.kr/news/articleView.html?idxno=3043388", "source": "청년의사", "date": "2026-10-09", "time": "16:01", "cat": "policy", "imp": "medium", "lang": "ko"}, {"title": "빌로이 급여로 완성한   list.forEach(function(a){if(!g[a.date])g[a.date]=[];g[a.date].push(a);});
  var h="";
  Object.keys(g).sort().reverse().forEach(function(d){
    var dd=new Date(d+"T00:00:00+09:00"),t=new Date();t.setHours(0,0,0,0);
    var df=Math.round((t-dd)/86400000);
    var lb=df===0?"오늘":df===1?"어제":df+"일 전";
    h+="<div class='sh'>"+lb+" · "+g[d].length+"건</div>";
    h+=g[d].map(mkCard).join("");
  });
  el.innerHTML=h;
}

bldTabs();render();
</script>
